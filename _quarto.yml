project:
  type: website
  output-dir: docs
  render:
    - content/ghg_proposal.qmd
    - content/*.qmd
    - content/*.md

website:
  title: "U.S. GHG Inventory System Proposal"
  navbar:
    left:
      - text: "Main Proposal"
        href: content/ghg_proposal.qmd
      - text: "GHG Inventory Methodology"
        href: content/ghg_inventory_methodology.qmd
      - text: "Technical Standards & Tools"
        href: content/technical_standards_and_tools_reference.qmd
      - text: "Boundary Notes"
        menu:
          - text: "Energy"
            href: content/energy_boundary_notes.md
          - text: "IPPU"
            href: content/ippu_boundary_notes.md
          - text: "Agriculture"
            href: content/agriculture_boundary_notes.md
          - text: "LULUCF"
            href: content/lulucf_boundary_notes.md
          - text: "Waste"
            href: content/waste_boundary_notes.md

format:
  html:
    theme: cosmo
    toc: true
    toc-location: left
    toc-depth: 3
    embed-resources: true
    standalone: true
    code-fold: false
    code-tools: false
